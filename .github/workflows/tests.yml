name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 6 * * *'  # tous les jours à 6h UTC

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_NAME: anthropic:claude-haiku-4-5
        run: uv run pytest -v --tb=short --junitxml=results.xml

      - name: Update README
        env:
          MODEL_NAME: anthropic:claude-haiku-4-5
        run: |
          python3 - << 'PYEOF'
          import xml.etree.ElementTree as ET
          import re
          from datetime import date
          import os

          tree = ET.parse('results.xml')
          root = tree.getroot()
          suite = root.find('testsuite') or root

          total = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          passed = total - failures - errors
          time_s = float(suite.get('time', 0))
          mins = int(time_s // 60)
          secs = int(time_s % 60)

          rows = []
          for tc in suite.findall('testcase'):
              name = tc.get('name')
              fail = tc.find('failure') or tc.find('error')
              if fail is not None:
                  msg = (fail.get('message') or '').split('\n')[0][:80]
                  rows.append(f'| {name} | ❌ FAILED | {msg} |')
              else:
                  rows.append(f'| {name} | ✅ PASSED | |')

          table = '\n'.join(rows)
          today = date.today().strftime('%-d %B %Y')
          model = os.environ.get('MODEL_NAME', 'anthropic:claude-haiku-4-5')
          icon = '✅' if passed == total else '⚠️'

          section = f"""## Derniers résultats de tests

**Date** : {today}
**Modèle** : `{model}`
**Serveur MCP** : `geocontext@0.9.8`
**Nombre de tests** : {total}

### Run — {passed}/{total} passed ({mins} min {secs:02d} s)

| Test | Résultat | Détail |
|------|----------|--------|
{table}

### Observations

- **{passed} tests sur {total} sont passés** {icon}
- Les 10 outils MCP (`adminexpress`, `altitude`, `assiette_sup`, `cadastre`, `geocode`, `gpf_wfs_describe_type`, `gpf_wfs_get_feature_by_id`, `gpf_wfs_get_features`, `gpf_wfs_search_types`, `urbanisme`) sont tous couverts."""

          with open('README.md', 'r') as f:
              content = f.read()

          new_content = re.sub(
              r'## Derniers résultats de tests.*?(?=\n## |\Z)',
              section,
              content,
              flags=re.DOTALL
          )

          with open('README.md', 'w') as f:
              f.write(new_content)

          print(f"README updated: {passed}/{total} passed")
          PYEOF

      - name: Commit and push README
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update test results $(date +'%Y-%m-%d')" && git push

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: results.xml
