[project]
name = "geocontext-test"
version = "0.1.0"
description = "Integration test suite to validate the correct behavior of the MCP ignfab/geocontext with different models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.1.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-md>=0.2.0",
    "pytest-rerunfailures>=16.1",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
# Tests run sequentially. They share scope="session" fixtures (MCP client,
# agent), and distributing them over several workers would open one MCP
# session per worker: concurrent requests from these sessions to the
# geocontext HTTP server get their responses crossed, which the mcp_tools
# fixture avoids by sharing a single session,
# see https://github.com/ignfab/geocontext-test/issues/33
addopts = "-p no:xdist -p no:xdist.looponfail"
asyncio_mode = "auto"
# MCP fixtures (mcp_tools, mcp_agent) and the model HTTP client are
# scope="session". Without a single shared event loop, the async httpx client
# stays bound to the loop of the first test, closed afterwards -> "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
reruns = 0
timeout = 240
