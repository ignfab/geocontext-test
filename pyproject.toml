[project]
name = "geocontext-test"
version = "0.1.0"
description = "Integration test suite to validate the correct behavior of the MCP ignfab/geocontext with different models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.2.15",
    "langchain-anthropic>=1.4.0",
    "langchain-google-genai>=4.2.1",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.3.5",
    "langgraph>=1.1.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-md>=0.2.0",
    "pytest-rerunfailures>=16.1",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
]

[tool.pytest.ini_options]
# Les tests s'exécutent séquentiellement. Ils partagent des fixtures
# scope="session" (client MCP, agent), et distribuer les tests sur plusieurs
# workers rouvrirait une session MCP par worker : les requêtes concurrentes de
# ces sessions vers le serveur geocontext en HTTP voient leurs réponses
# croisées, ce que le fixture mcp_tools évite en partageant une seule session,
# cf. https://github.com/ignfab/geocontext-test/issues/33
addopts = "-p no:xdist -p no:xdist.looponfail"
asyncio_mode = "auto"
# Les fixtures MCP (mcp_tools, mcp_agent) et le client HTTP du modèle sont
# scope="session". Sans partager un unique event loop, le client httpx async
# reste lié au loop du premier test, fermé ensuite -> "Event loop is closed".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
reruns = 0
timeout = 240
